name: Pipeline CI/CD JeuVideOps

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  job-build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./jeu-1-two-ships
    steps:
      - name: Récupération du code
        uses: actions/checkout@v5
      - name: Configuration de Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm' # Active la mise en cache ici
          # pointe vers le fichier de verrouillage déplacé
          cache-dependency-path: './jeu-1-two-ships/package-lock.json'
      - name: Installation des dépendances
        run: npm install

  job-audit:
    needs: job-build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./jeu-1-two-ships
    steps:
      - name: Récupération du code
        uses: actions/checkout@v5
      - name: Configuration de Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm' # Récupère le cache créé par job-build
          cache-dependency-path: './jeu-1-two-ships/package-lock.json'
      - name: Installation des dépendances
        # Cette étape sera quasi-instantanée grâce au cache
        run: npm install
      - name: Audit des dépendances
        run: npm audit

  job-lint:
    needs: job-build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./jeu-1-two-ships
    steps:
      - name: Récupération du code
        uses: actions/checkout@v5
      - name: Configuration de Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          # précise où chercher les dépendances
          cache-dependency-path: './jeu-1-two-ships/package-lock.json'
      - name: Installation des dépendances
        run: npm install
      - name: Linter
        run: npm run lint

  job-test:
    needs: job-build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./jeu-1-two-ships
    steps:
      - name: Récupération du code
        uses: actions/checkout@v5
      - name: Configuration de Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './jeu-1-two-ships/package-lock.json'
      - name: Installation des dépendances
        run: npm install
      - name: Lancement des tests unitaires
        run: npm run test

  job-test-fonctionnel:
    needs: job-build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./jeu-1-two-ships
    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Configuration de Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './jeu-1-two-ships/package-lock.json'

      - name: Installation des dépendances
        run: npm install

      - name: Lancement des tests e2e
        run: npx cypress run

      - name: Capture d'écran
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: erreur-cypress
          # indique ou recuperer la capture
          #met à jour le chemin avec le nouveau dossier parent
          path: jeu-1-two-ships/cypress/screenshots/

  job-summary:
      needs: [job-test, job-lint, job-audit, job-test-fonctionnel]
      if: always()
      runs-on: ubuntu-22.04
      steps:
        - name: Téléchargement de la capture
          #vérifie strictement si le travail de test a un statut d'échec
          if: needs.job-test-fonctionnel.result == 'failure'
          uses: actions/download-artifact@v5
          with:
            name: erreur-cypress
            path: image-recuperee

        - name: Génération du résumé global
          run: |
            echo "## Bilan de l'exécution" >> $GITHUB_STEP_SUMMARY
            echo "- Audit : ${{ needs.job-audit.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Linter : ${{ needs.job-lint.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Tests Unitaires : ${{ needs.job-test.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Tests Fonctionnels : ${{ needs.job-test-fonctionnel.result }}" >> $GITHUB_STEP_SUMMARY
          
            if [ -d "image-recuperee" ]; then
              echo "### Erreur visuelle détectée" >> $GITHUB_STEP_SUMMARY
              echo "Un test fonctionnel a échoué. Télécharge l'archive **erreur-cypress** dans la section *Artifacts* pour visionner la capture d'écran." >> $GITHUB_STEP_SUMMARY
            fi
  job-docker:
    #attend la fin des tests
    needs: [job-test, job-lint, job-audit, job-test-fonctionnel]
    # s'exécute si tout est vert
    if: success()
    #choisit le système
    runs-on: ubuntu-22.04
    permissions:
      # autorise la lecture du code
      contents: read
      # donne les accès pour les images
      packages: write
    steps:
      #télécharge le code
      - uses: actions/checkout@v5
      # identifie le compte sur le serveur
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #sauvegarde le nom en minuscules dans la mémoire globale du serveur
      - run: echo "repo_tolower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      # utilise la mémoire globale pour compiler
      - run: docker build -t ghcr.io/${{ env.repo_tolower }}/portail:latest ./portail-web
      #expédie la vitrine
      - run: docker push ghcr.io/${{ env.repo_tolower }}/portail:latest
      # assemble le jeu
      - run: docker build -t ghcr.io/${{ env.repo_tolower }}/two-ships:latest ./jeu-1-two-ships
      #pousse le conteneur en ligne
      - run: docker push ghcr.io/${{ env.repo_tolower }}/two-ships:latest